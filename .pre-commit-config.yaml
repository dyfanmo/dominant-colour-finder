repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # The data files are third-party artifacts and should stay byte-identical
      # to their source, so the whitespace fixers leave them alone.
      - id: trailing-whitespace
        exclude: ^src/dominant_colour/data/
      - id: end-of-file-fixer
        exclude: ^src/dominant_colour/data/
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]

  - repo: local
    hooks:
      # mypy needs the project's own environment to see numpy and Pillow,
      # so it runs through uv rather than in an isolated pre-commit venv.
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        types: [python]
        pass_filenames: false
