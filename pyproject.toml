[project]
name = "dominant-colour-finder"
version = "0.1.0"
description = "Find the dominant colour(s) of an image."
requires-python = ">=3.14"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dominant_colour"]
# The lookup table is needed at runtime. The benchmark data isn't - it's only
# used by scripts/benchmark_colour_naming.py.
artifacts = ["src/dominant_colour/data/w2c.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/dominant_colour"]

[tool.coverage.report]
# A floor, not a target. Coverage says which lines never run, not whether
# the assertions on them mean anything.
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
mypy_path = "src"
ignore_missing_imports = true
